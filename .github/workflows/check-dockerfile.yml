name: Check Dockerfile

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        run: docker build -t vxp_platform:latest .

      - name: Run Docker container in the background
        run: docker run -d --name vxp_test_container vxp_platform:latest

      - name: Check if Flask app is running
        run: docker logs vxp_test_container

      #- name: Health check with curl
      #  run: curl -f http://localhost:5001/ || (docker logs vxp_test_container && exit 1)

      - name: Stop and remove the container
        run: docker stop vxp_test_container && docker rm vxp_test_container
